server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://application:8080/; }
  location /angular/ { try_files $uri $uri/ /angular/index.html; }
  location /native/ { try_files $uri $uri/ /native/index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
