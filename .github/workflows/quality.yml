name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.8.15
          enable-cache: true
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run build
      - run: docker compose --env-file .env.example -f docker/compose.yaml config --quiet
      - run: cp .env.example .env
      - run: npm exec --workspace @signal-lab/e2e playwright install --with-deps chromium
      - run: npm run e2e
