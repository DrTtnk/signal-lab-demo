[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lab-fixtures"
version = "0.1.0"
description = "Standalone fixture generator and SciPy numerical reference for Signal Lab"
requires-python = ">=3.13,<3.15"
dependencies = [
  "numpy>=2.3,<3",
  "scipy==1.18.1",
  "pydantic>=2.12,<3",
  "jsonschema[format-nongpl]==4.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.14,<1",
  "pyright>=1.1.407,<2",
  "scipy-stubs==1.18.1.1",
  "types-jsonschema==4.26.0.20261006",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
