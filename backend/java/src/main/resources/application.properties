spring.application.name=signal-lab-api
management.endpoints.web.exposure.include=health
spring.flyway.schemas=analysis
spring.flyway.default-schema=analysis
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s
engine.path=${ENGINE_PATH}
engine.deadline=${ENGINE_DEADLINE}
engine.workers=${ENGINE_WORKERS}
consumer.id=${HOSTNAME}
analysis.queue.name=analysis.batches
analysis.queue.max-depth=20
analysis.queue.confirm-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
analysis.queue.reconcile-after=2m
spring.rabbitmq.connection-timeout=2s
recordings.connect-timeout=${spring.http.clients.connect-timeout}
