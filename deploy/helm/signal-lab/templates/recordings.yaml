apiVersion: v1
kind: Service
metadata:
  name: recordings
spec:
  selector: { app: recordings }
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recordings
spec:
  replicas: 1
  selector:
    matchLabels: { app: recordings }
  template:
    metadata:
      labels: { app: recordings }
    spec:
      containers:
        - name: recordings
          image: {{ .Values.image.recordings }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RECORDINGS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: signal-lab, key: RECORDINGS_DATABASE_URL }
            - { name: RECORDINGS_DIR, value: /data }
            - { name: CONTRACTS_DIR, value: /app/contracts/v1 }
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.recordings.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: fixtures, mountPath: /data, readOnly: true }
      volumes:
        - name: fixtures
          hostPath:
            path: {{ .Values.fixturesHostPath }}
            type: Directory
