apiVersion: v1
kind: Secret
metadata:
  name: signal-lab
type: Opaque
stringData:
  POSTGRES_DB: {{ required "credentials.postgresDb is required" .Values.credentials.postgresDb | quote }}
  POSTGRES_USER: {{ required "credentials.postgresUser is required" .Values.credentials.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "credentials.postgresPassword is required" .Values.credentials.postgresPassword | quote }}
  RECORDINGS_DB_PASSWORD: {{ required "credentials.recordingsDbPassword is required" .Values.credentials.recordingsDbPassword | quote }}
  ANALYSIS_DB_PASSWORD: {{ required "credentials.analysisDbPassword is required" .Values.credentials.analysisDbPassword | quote }}
  RABBITMQ_USER: {{ required "credentials.rabbitmqUser is required" .Values.credentials.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ required "credentials.rabbitmqPassword is required" .Values.credentials.rabbitmqPassword | quote }}
  RECORDINGS_DATABASE_URL: {{ printf "postgresql+psycopg://recordings:%s@database:5432/%s" (required "credentials.recordingsDbPassword is required" .Values.credentials.recordingsDbPassword) .Values.credentials.postgresDb | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://database:5432/%s" .Values.credentials.postgresDb | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "credentials.analysisDbPassword is required" .Values.credentials.analysisDbPassword | quote }}
